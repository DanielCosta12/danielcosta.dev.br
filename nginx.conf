server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirecionamentos relativos (não expõe host/porta interna atrás do tunnel)
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404/index.html;

    # Arquivos com hash no nome: nunca mudam, cache "eterno"
    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Imagens e ícones sem hash: cache de 7 dias
    location ~* \.(?:png|webp|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # Páginas pré-renderizadas (/sobre -> /sobre/index.html).
    # no-cache: o navegador sempre revalida, então um deploy novo aparece na hora
    # e nunca fica um HTML antigo apontando para assets que já não existem.
    location / {
        try_files $uri $uri/index.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
